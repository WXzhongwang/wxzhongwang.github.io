<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
(function () {
  var $ = BD.$, esc = BD.esc;

  function init() {
    renderBankModules();
    /* 数据只用于同步状态提示 */
    BD.loadRows(function (rows, ok, count) { BD.setSync(ok, count); });
  }

  function renderBankModules() {
    var grid = $('bankGrid');
    grid.innerHTML = '';
    BD.BANK_MODULES.forEach(function (m) {
      var a = document.createElement('a');
      a.className = 'bk-card';
      a.href = BD.moduleUrl(m.slug);
      a.innerHTML = '<div class="bk-card-icon" style="background:' + m.color + '">' + esc(m.icon) + '</div>'
        + '<div class="bk-card-info">'
        +   '<div class="bk-card-name">' + esc(m.name) + '</div>'
        +   '<div class="bk-card-desc">' + esc(m.desc) + '</div>'
        +   '<div class="bk-card-meta"><b>' + m.topics.length + '</b> 个知识点 · 进入 →</div>'
        + '</div>';
      grid.appendChild(a);
    });
  }

  window.addEventListener('DOMContentLoaded', init);
})();
</script>
