    grid.innerHTML = '';
    BANK_MODULES.forEach(function (m) {
      var mod = document.createElement('div');
      mod.className = 'bk-mod';
      var head = document.createElement('div');
      head.className = 'bk-mod-head';
      head.innerHTML = '<div class="bk-mod-icon" style="background:' + m.color + '">' + esc(m.icon) + '</div>'
        + '<div class="bk-mod-info"><div class="bk-mod-name">' + esc(m.name) + '</div>'
        + '<div class="bk-mod-desc">' + esc(m.desc) + '</div></div>'
        + '<div class="bk-mod-side"><div class="bk-mod-count"><b>' + m.topics.length + '</b> 个知识点</div></div>'
        + '<span class="bk-mod-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>';
      head.onclick = function () { mod.classList.toggle('open'); };
      var body = document.createElement('div');
      body.className = 'bk-mod-body';
      m.topics.forEach(function (tp, ti) {
        var it = document.createElement('div');
        it.className = 'bk-topic';
        it.innerHTML = '<span class="bk-topic-idx">' + (ti + 1) + '</span>'
          + '<div class="bk-topic-info"><div class="bk-topic-name">' + esc(tp.t) + '</div>'
          + (tp.d ? '<div class="bk-topic-desc">' + esc(tp.d) + '</div>' : '') + '</div>'
          + (tp.card ? '<span class="bk-topic-link">查看卡片 →</span>' : '');
        it.onclick = function () { if (tp.card) location.href = BD.cardUrl(tp.card); };
        body.appendChild(it);
      });
      mod.appendChild(head);
      mod.appendChild(body);
      grid.appendChild(mod);
    });
  }

  window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
