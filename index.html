<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>知识卡片库 · zhongwang 的大数据宝典</title>
<!-- 卡片库首页：今日待复习 + 搜索筛选 + 知识卡片网格；点击卡片进入 card.html 详情子页 -->
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header>
  <div class="hd-inner">
    <div class="hd-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </div>
    <div>
      <div class="hd-title">zhongwang 的大数据宝典</div>
      <div class="hd-sub">技术栈 · 原理 · 面试题 · 架构方案 · 核心代码</div>
    </div>
    <div class="hd-right">
      <span class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncText">加载中</span></span>
      <button class="hd-btn" onclick="BD.exportJSON(ROWS)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span class="t">导出备份</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="backupTip" class="backup-tip hidden">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    <span>知识库已积累 <b id="backupCount">30</b> 条，且复习进度仅保存在本机浏览器，建议点击右上角「导出备份」保存 JSON 快照。</span>
  </div>

  <!-- 顶部页面导航（PC） -->
  <nav class="tabs">
    <a class="tab on" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      知识卡片库<span class="tab-count" id="cntAll">0</span>
    </a>
    <a class="tab" href="interview.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      面试专题
    </a>
    <a class="tab" href="stats.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      学习统计
    </a>
    <a class="tab" href="algo.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10"></path><path d="M10 20v-6h6v6"></path><path d="M22 22l-5-5"></path><circle cx="17.5" cy="17.5" r="3.5"></circle></svg>
      算法刷题
    </a>
    <a class="tab" href="bank.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
      中间件题库
    </a>
  </nav>

  <!-- 今天要处理 -->
  <div class="today-card">
    <div class="today-head" onclick="toggleToday()">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        今天要处理
      </h2>
      <div class="today-stats">
        <span class="stat-chip due" id="statDue">逾期 0</span>
        <span class="stat-chip today" id="statToday">今日 0</span>
        <span class="stat-chip" id="statSoon">近3天 0</span>
      </div>
    </div>
    <div class="today-body" id="todayBody"></div>
  </div>

  <!-- 搜索 + 筛选 -->
  <div class="filter-bar">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="搜索知识点（如：Kafka、Shuffle、Checkpoint）" oninput="onSearch()">
    </div>
  </div>
  <div class="filter-bar">
    <button class="chip on" data-stack="" onclick="setStackFilter('')">全部</button>
    <span id="stackChips"></span>
  </div>
  <div class="filter-bar">
    <button class="chip on" data-type="" onclick="setTypeFilter('')">全部类型</button>
    <span id="typeChips"></span>
  </div>

  <div class="k-grid" id="libraryGrid"></div>
  <div id="libraryEmpty"></div>
</div>

<!-- 底部移动端导航 -->
<nav class="bottom-nav">
  <a class="bn-item on" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    卡片库
  </a>
  <a class="bn-item" href="interview.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    面试专题
  </a>
  <a class="bn-item" href="stats.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    统计
  </a>
  <a class="bn-item" href="algo.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10"></path><path d="M10 20v-6h6v6"></path><path d="M22 22l-5-5"></path><circle cx="17.5" cy="17.5" r="3.5"></circle></svg>
    算法
  </a>
  <a class="bn-item" href="bank.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
    题库
  </a>
</nav>

<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script>
(function () {
  var $ = BD.$, esc = BD.esc, toast = BD.toast;
  var ROWS = [];
  window.ROWS = ROWS; // 供导出按钮使用
  var STATE = { stackFilter: '', typeFilter: '', keyword: '', todayOpen: true };

  function init() {
    renderStackChips();
    renderTypeChips();
    BD.loadRows(function (rows, ok, count) {
      ROWS.length = 0;
      rows.forEach(function (r) { ROWS.push(r); });
      BD.setSync(ok, count);
      renderToday();
      renderLibrary();
      renderBackupTip();
    });
  }

  /* ---------- 今日要处理 ---------- */
  function renderToday() {
    var due = [], tdy = [], soon = [];
    ROWS.forEach(function (r) {
      var du = BD.daysUntil(r['下次复习']);
      if (du < 0) { due.push(r); } else if (du === 0) { tdy.push(r); } else if (du <= 3) { soon.push(r); }
    });
    $('statDue').textContent = '逾期 ' + due.length;
    $('statToday').textContent = '今日 ' + tdy.length;
    $('statSoon').textContent = '近3天 ' + soon.length;
    var body = $('todayBody');
    if (!due.length && !tdy.length && !soon.length) {
      body.innerHTML = '<div class="today-empty">今日无待复习任务，可以预习新知识或巩固已学内容。</div>';
      return;
    }
    body.innerHTML = '';
    var groups = [{ list: due, cls: 'over' }, { list: tdy, cls: 'tdy' }, { list: soon, cls: 'soon' }];
    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      for (var i = 0; i < grp.list.length; i++) {
        (function (r, cls) {
          var du = BD.daysUntil(r['下次复习']);
          var div = document.createElement('div'); div.className = 't-item clickable';
          div.title = '点击进入卡片详情';
          var badge = document.createElement('span'); badge.className = 't-badge ' + cls;
          var info = document.createElement('div'); info.className = 't-info';
          var name = document.createElement('div'); name.className = 't-name' + (cls === 'over' ? ' overdue' : '');
          name.textContent = r['名称'] || '未命名';
          var meta = document.createElement('div'); meta.className = 't-meta';
          var metaTxt = (r['技术栈'] || '') + ' · ';
          if (cls === 'over') { metaTxt += '逾期 ' + (-du) + ' 天'; } else if (cls === 'tdy') { metaTxt += '今天到期'; } else { metaTxt += BD.fmtDate(r['下次复习']) + ' 到期'; }
          metaTxt += ' · 已复习 ' + (r['复习次数'] || 0) + ' 次 · 点击查看';
          meta.innerHTML = metaTxt;
          var act = document.createElement('div'); act.className = 't-act';
          var btn = document.createElement('button');
          btn.className = 'btn-done' + (cls === 'over' ? ' overdue' : '');
          btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' + (cls === 'over' ? '补复习' : '完成复习');
          btn.onclick = function (e) { e.stopPropagation(); BD.completeReview(r); renderToday(); renderLibrary(); };
          act.appendChild(btn);
          div.onclick = function () { location.href = BD.cardUrl(r._id); };
          div.appendChild(badge); div.appendChild(info); div.appendChild(act);
          info.appendChild(name); info.appendChild(meta);
          body.appendChild(div);
        })(grp.list[i], grp.cls);
      }
    }
  }

  function toggleToday() {
    var body = $('todayBody');
    STATE.todayOpen = !STATE.todayOpen;
    body.classList.toggle('hidden', !STATE.todayOpen);
  }

  /* ---------- 筛选 ---------- */
  function renderStackChips() {
    var box = $('stackChips'); box.innerHTML = '';
    BD.STACKS.forEach(function (s) {
      var b = document.createElement('button');
      b.className = 'chip' + (STATE.stackFilter === s ? ' on' : '');
      b.textContent = s;
      b.onclick = function () { setStackFilter(STATE.stackFilter === s ? '' : s); };
      box.appendChild(b);
    });
    var allBtn = document.querySelector('.chip[data-stack]');
    allBtn.classList.toggle('on', !STATE.stackFilter);
  }

  function renderTypeChips() {
    var box = $('typeChips'); box.innerHTML = '';
    BD.TYPES.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'chip' + (STATE.typeFilter === t ? ' on' : '');
      b.textContent = t;
      b.onclick = function () { setTypeFilter(STATE.typeFilter === t ? '' : t); };
      box.appendChild(b);
    });
    var allBtn = document.querySelector('.chip[data-type]');
    allBtn.classList.toggle('on', !STATE.typeFilter);
  }

  function setStackFilter(s) { STATE.stackFilter = s; renderStackChips(); renderLibrary(); }
  function setTypeFilter(t) { STATE.typeFilter = t; renderTypeChips(); renderLibrary(); }
  function onSearch() { STATE.keyword = $('searchInput').value.trim(); renderLibrary(); }

  function filteredRows() {
    var k = STATE.keyword.toLowerCase();
    return ROWS.filter(function (r) {
      if (STATE.stackFilter && r['技术栈'] !== STATE.stackFilter) return false;
      if (STATE.typeFilter && !BD.hasType(r, STATE.typeFilter)) return false;
      if (k) {
        var hay = ((r['名称'] || '') + ' ' + (r['详细内容'] || '') + ' ' + (r['技术栈'] || '')).toLowerCase();
        if (hay.indexOf(k) < 0) return false;
      }
      return true;
    });
  }

  /* ---------- 卡片网格 ---------- */
  function renderLibrary() {
    var rows = filteredRows();
    $('cntAll').textContent = ROWS.length;
    var grid = $('libraryGrid'); grid.innerHTML = '';
    var empty = $('libraryEmpty'); empty.innerHTML = '';
    if (!rows.length) {
      empty.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><div>暂无匹配的知识卡片<br>请调整筛选条件</div></div>';
      return;
    }
    rows.forEach(function (r) { grid.appendChild(cardEl(r)); });
  }

  function cardEl(r) {
    var du = BD.daysUntil(r['下次复习']);
    var card = document.createElement('div');
    card.className = 'k-card' + (du < 0 ? ' overdue' : '');
    var stack = r['技术栈'] || '';
    var types = r['知识类型'] || [];
    var html = '';
    html += '<div class="k-top">';
    if (stack) html += '<span class="k-stack">' + esc(stack) + '</span>';
    if (du < 0) html += '<span class="k-ov">逾期 ' + (-du) + ' 天</span>';
    html += '</div>';
    html += '<div class="k-name">' + esc(r['名称'] || '未命名') + '</div>';
    html += '<div class="k-types">';
    for (var i = 0; i < types.length; i++) { html += '<span class="k-type">' + esc(types[i]) + '</span>'; }
    if (r['结构图']) html += '<span class="k-diabadge">📐 图解</span>';
    html += '</div>';
    var lv = r['掌握度'] || '待学习';
    html += '<div class="k-foot">';
    html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
    html += '<span class="k-next' + (du < 0 ? ' due' : '') + '">' + (du < 0 ? '应于 ' + BD.fmtDate(r['下次复习']) + ' 复习' : (du === 0 ? '今天复习' : BD.fmtDate(r['下次复习']) + ' 复习')) + '</span>';
    html += '<span class="grow"></span>';
    html += '<span class="k-level ' + BD.levelClass(lv) + '">' + esc(lv) + '</span>';
    html += '</div>';
    card.innerHTML = html;
    card.onclick = function () { location.href = BD.cardUrl(r._id); };
    return card;
  }

  function renderBackupTip() {
    var n = ROWS.length;
    if (n >= 30) { $('backupCount').textContent = n; $('backupTip').classList.remove('hidden'); }
    else { $('backupTip').classList.add('hidden'); }
  }

  window.toggleToday = toggleToday;
  window.setStackFilter = setStackFilter;
  window.setTypeFilter = setTypeFilter;
  window.onSearch = onSearch;
  window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
