<script src="assets/app.js"></script>
<script>
(function () {
  var $ = BD.$, esc = BD.esc;

  function getParam(name) {
    var m = location.search.match(new RegExp('[?&]' + name + '=([^&#]*)'));
    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }

  function renderHead(m) {
    var h = $('moduleHead');
    h.innerHTML = '<div class="module-head">'
      + '<div class="module-head-icon" style="background:' + m.color + '">' + esc(m.icon) + '</div>'
      + '<div class="module-head-info">'
      +   '<div class="module-head-name">' + esc(m.name) + '</div>'
      +   '<div class="module-head-desc">' + esc(m.desc) + '</div>'
      +   '<div class="module-head-meta">共 ' + m.topics.length + ' 个核心知识点</div>'
      + '</div></div>';
    document.title = m.name + ' · 中间件题库 · zhongwang 的大数据宝典';
  }

  function renderTopics(m) {
    var list = $('topicList');
    list.innerHTML = '';
    m.topics.forEach(function (tp, ti) {
      var it = document.createElement('a');
      it.className = 'bk-topic';
      it.href = tp.card ? BD.cardUrl(tp.card) : '#';
      it.innerHTML = '<span class="bk-topic-idx">' + (ti + 1) + '</span>'
        + '<div class="bk-topic-info"><div class="bk-topic-name">' + esc(tp.t) + '</div>'
        + (tp.d ? '<div class="bk-topic-desc">' + esc(tp.d) + '</div>' : '')
        + '</div>'
        + '<span class="bk-topic-link">查看卡片 →</span>';
      list.appendChild(it);
    });
  }

  function renderNotFound() {
    $('moduleHead').innerHTML = '<div class="empty-state">'
      + '<div style="font-size:36px;margin-bottom:8px">⚠️</div>'
      + '<div style="font-weight:700;color:var(--text);margin-bottom:4px">未找到该中间件</div>'
      + '<div style="margin-bottom:14px">该中间件不存在或已被移除</div>'
      + '<a class="hd-back" href="bank.html" style="background:var(--primary);color:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="15 18 9 12 15 6"></polyline></svg>返回题库</a>'
      + '</div>';
    $('topicList').innerHTML = '';
  }

  function init() {
    var slug = getParam('id');
    var m = slug ? BD.findModule(slug) : null;
    if (!m) { renderNotFound(); return; }
    renderHead(m);
    renderTopics(m);
    /* 同步状态 */
    BD.loadRows(function (rows, ok, count) { BD.setSync(ok, count); });
  }

  window.addEventListener('DOMContentLoaded', init);
})();
</script>
